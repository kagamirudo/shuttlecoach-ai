<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img">
<title>Build and start from Terminal</title>
<desc>Run these commands inside the cloned project folder.. Schematic illustration, not a screenshot.</desc>
<rect x="0" y="0" width="1280" height="680" rx="0" fill="#f2f7f4" stroke="#f2f7f4"/>
<rect x="0" y="0" width="1280" height="118" rx="0" fill="#153d32" stroke="#153d32"/>
<text x="44" y="51" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="white" font-weight="700">Build and start from Terminal</text>
<text x="44" y="88" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9e8d9" font-weight="400">Run these commands inside the cloned project folder.</text>
<rect x="42" y="152" width="1196" height="382" rx="14" fill="#122c26" stroke="#122c26"/>
<text x="68" y="188" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#8ab7a1" font-weight="700">TERMINAL · example output</text>
<line x1="65" y1="204" x2="1215" y2="204" stroke="#345449" stroke-width="2"/>
<text x="70" y="246" font-family="Menlo, Consolas, monospace" font-size="20" fill="#81d5ac" font-weight="400">~/projects $</text>
<text x="290" y="246" font-family="Menlo, Consolas, monospace" font-size="20" fill="white" font-weight="400">git clone https://github.com/kagamirudo/shuttlecoach-ai.git</text>
<text x="70" y="301" font-family="Menlo, Consolas, monospace" font-size="20" fill="#81d5ac" font-weight="400">~/projects $</text>
<text x="290" y="301" font-family="Menlo, Consolas, monospace" font-size="20" fill="white" font-weight="400">cd shuttlecoach-ai</text>
<text x="70" y="356" font-family="Menlo, Consolas, monospace" font-size="20" fill="#81d5ac" font-weight="400">shuttlecoach-ai $</text>
<text x="315" y="356" font-family="Menlo, Consolas, monospace" font-size="20" fill="white" font-weight="400">make docker-up</text>
<text x="70" y="434" font-family="Menlo, Consolas, monospace" font-size="20" fill="#a8bcb3" font-weight="400">… first run: dependency build and verified model downloads …</text>
<text x="70" y="486" font-family="Menlo, Consolas, monospace" font-size="23" fill="#8aefb5" font-weight="700">Container shuttlecoach-app-1   Healthy</text>
<rect x="42" y="556" width="1196" height="66" rx="14" fill="#dff3e8" stroke="#b9dbc9"/>
<text x="67" y="598" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#153d32" font-weight="700">Next: open http://127.0.0.1:8502 in your browser</text>
<text x="44" y="656" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#566b63" font-weight="400">SETUP ILLUSTRATION · simplified screens, no private footage or API keys</text>
</svg>
